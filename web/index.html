<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TRUHive — search, preview, download and play music on your own device.">
  <meta name="theme-color" content="#0A1931">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TRUHive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TRUHive</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while the app engine downloads; removed on Flutter's first frame. */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; background: radial-gradient(circle at 50% 35%, #1B3358, #0A1931 70%);
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #E6EEF7;
      transition: opacity .3s ease; }
    #loading img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    #loading .bar { width: 140px; height: 3px; border-radius: 2px; background: rgba(185,215,234,.18); overflow: hidden; }
    #loading .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #B9D7EA; animation: slide 1.1s ease-in-out infinite; }
    #loading p { margin: 0; color: rgba(230,238,247,.6); font-weight: 500; font-size: 13px; }
    #loading.done { opacity: 0; pointer-events: none; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading .bar::after { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
<body style="background:#0A1931">
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>TRUHive</div>
    <div class="bar"></div>
    <p>Loading your music…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
