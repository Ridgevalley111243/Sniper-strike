name: Build TRUHive

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Public URL of the TRUHive backend (supabase/functions/truhive-api).
  BACKEND: --dart-define=TRUHIVE_BACKEND_URL=https://ypliibgdetwgbdlxjirg.supabase.co/functions/v1/truhive-api

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test the backend function
        run: |
          deno check supabase/functions/truhive-api/index.ts
          deno test --allow-env supabase/functions/truhive-api

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release $BACKEND

      - name: Build web app
        run: flutter build web --release $BACKEND

      - name: Drop unused web fonts
        run: python3 tool/slim_web_build.py build/web

      - uses: actions/upload-artifact@v4
        with:
          name: truhive-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: truhive-web
          path: build/web
